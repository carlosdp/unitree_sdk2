[build-system]
requires = [
    "scikit-build-core>=0.7.0",
    "pybind11>=2.10",
    "packaging",
]
build-backend = "scikit_build_core.build"

[project]
name = "unitree_sdk2"
version = "0.2.0"
description = "Unitree robot SDK bindings (pybind11) with bundled DDS libs"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = ["cibuildwheel>=2.16", "build", "twine"]

[tool.scikit-build]
wheel.expand-macos-universal-tags = true
cmake.version = ">=3.20"
build.verbose = true

[tool.scikit-build.cmake.define]
BUILD_PYTHON_BINDING = "ON"
BUILD_EXAMPLES = "OFF"

[tool.cibuildwheel]
skip = "pp* *-musllinux_*"
build = "cp38-manylinux_x86_64 cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp38-manylinux_aarch64 cp39-manylinux_aarch64 cp310-manylinux_aarch64 cp311-manylinux_aarch64 cp312-manylinux_aarch64"
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
environment = "SKBUILD_CMAKE_ARGS='-DBUILD_PYTHON_BINDING=ON'"
before-build = "python -m pip install scikit-build-core pybind11"
test-command = "python -c \"import unitree_interface; print(unitree_interface.get_robot_name if hasattr(unitree_interface, 'get_robot_name') else 'ok')\""
